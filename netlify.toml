[build]
base = "frontend"
command = "npm run build"
publish = "frontend/dist"

[build.environment]
VITE_API_BASE_URL = "same-origin"

[[redirects]]
from = "/api/*"
to = "https://saas-intelligence-copilot-api.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/health"
to = "https://saas-intelligence-copilot-api.onrender.com/health"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
